<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2346"/>
      <stop offset="1" stop-color="#17203A"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- headphones -->
  <path d="M104 316 V284 A152 152 0 0 1 408 284 V316" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  <rect x="72" y="276" width="96" height="140" rx="36" fill="#fff"/>
  <rect x="92" y="298" width="56" height="96" rx="20" fill="url(#cup)"/>
  <rect x="344" y="276" width="96" height="140" rx="36" fill="#fff"/>
  <rect x="364" y="298" width="56" height="96" rx="20" fill="url(#cup)"/>
  <!-- bar chart between the ear cups -->
  <rect x="180" y="334" width="28" height="70" rx="9" fill="#fff" opacity="0.55"/>
  <rect x="216" y="294" width="28" height="110" rx="9" fill="#fff" opacity="0.7"/>
  <rect x="252" y="312" width="28" height="92" rx="9" fill="#fff" opacity="0.85"/>
  <rect x="288" y="262" width="28" height="142" rx="9" fill="#fff"/>
  <!-- trend line -->
  <polyline points="194,306 230,262 266,282 302,232" fill="none" stroke="#FFD34D" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- note badge -->
  <circle cx="404" cy="140" r="64" fill="url(#note)" stroke="#fff" stroke-width="10"/>
  <g fill="#fff">
    <rect x="404" y="104" width="12" height="62" rx="4"/>
    <path d="M410 104 C428 110 442 120 444 140 C434 130 422 128 410 128 Z"/>
    <ellipse cx="394" cy="166" rx="21" ry="16" transform="rotate(-22 394 166)"/>
  </g>
</svg>
