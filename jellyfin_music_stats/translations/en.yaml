configuration:
  jellyfin_url:
    name: Jellyfin URL
    description: Address of your Jellyfin server, e.g. http://2937404c-jellyfin:8096 for the Jellyfin add-on.
  api_key:
    name: API key
    description: Create one in Jellyfin under Dashboard → API Keys.
  poll_interval:
    name: Poll interval
    description: Seconds between checks of what is playing.
  min_play_percent:
    name: Minimum listened (%)
    description: How much of a track must be heard before it counts as a listen. Four minutes always counts.
  lastfm_api_key:
    name: Last.fm API key
    description: Optional. Fetches mood tags from Last.fm.
  user_map:
    name: User mapping
    description: Links Home Assistant users to Jellyfin users when their names differ. One line per user, e.g. "christian=Tntdruid".
  genre_map:
    name: Merge genres
    description: Genres that should count as one when their names differ. One line per genre, e.g. "Alternative=Alternativ". Case, spaces, hyphens and slashes are merged automatically.
