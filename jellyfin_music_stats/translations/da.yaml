configuration:
  jellyfin_url:
    name: Jellyfin URL
    description: Adressen på din Jellyfin-server, fx http://2937404c-jellyfin:8096 for Jellyfin-add-on'et.
  api_key:
    name: API-nøgle
    description: Opret den i Jellyfin under Kontrolpanel → API-nøgler.
  poll_interval:
    name: Opdateringsinterval
    description: Sekunder mellem hvert tjek af, hvad der spilles.
  min_play_percent:
    name: Minimum lyttet (%)
    description: Hvor meget af et nummer der skal høres, før det tæller som en lytning. Fire minutter tæller altid.
  lastfm_api_key:
    name: Last.fm API-nøgle
    description: Valgfri. Henter humør-tags fra Last.fm.
  user_map:
    name: Brugerkobling
    description: Kobler Home Assistant-brugere til Jellyfin-brugere, når navnene er forskellige. Én linje pr. bruger, fx "christian=Tntdruid".
